name: Gitleaks

# Scans new commits for secrets with Gitleaks: the PR's commits on
# pull_request, the pushed commits on push, and the full history on
# workflow_dispatch. Findings that were triaged (false positives, or secrets
# already rotated) go in .gitleaksignore in the repository root.

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary is used instead of gitleaks-action, which needs a license key for organizations
      - name: Install Gitleaks
        working-directory: /tmp
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="-1 ${SHA}"
              else
                range="${BEFORE}..${SHA}"
              fi ;;
            *) range="--all" ;;
          esac
          echo "Scanning: ${range}"
          status=0
          gitleaks git . --redact --no-banner --log-opts="${range}" \
            --report-format json --report-path /tmp/gitleaks.json || status=$?
          if [ -s /tmp/gitleaks.json ] && [ "$(jq length /tmp/gitleaks.json)" -gt 0 ]; then
            {
              echo "### Gitleaks findings"
              echo
              echo "Rotate any real secret, then add its fingerprint to \`.gitleaksignore\`. Do not rewrite history."
              echo
              echo "| File | Line | Rule | Commit | Fingerprint |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.File) | \(.StartLine) | \(.RuleID) | \(.Commit[:8]) | `\(.Fingerprint)` |"' /tmp/gitleaks.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
